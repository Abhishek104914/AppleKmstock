    function formatINR(num) {
      return "₹" + Number(num || 0).toLocaleString('en-IN');
    }

    function formatTime(isoStr) {
      if (!isoStr) return "Not updated yet";
      const d = new Date(isoStr);
      if (isNaN(d.getTime())) return String(isoStr);
      return d.toLocaleDateString('en-IN', { day: '2-digit', month: 'short' }) + ', ' +
             d.toLocaleTimeString('en-IN', { hour: '2-digit', minute: '2-digit', hour12: true });
    }

      el.textContent = msg;
      box.appendChild(el);
      setTimeout(() => el.remove(), 2800);
    }

    function slugId(val) {
      return String(val || '').toLowerCase().trim().replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '');
    }

    function buildCanonicalSku(prodId, colId, vr) {
      const internalKey = `${prodId}__${colId}__${vr}`;
      if (DB_SKU_BY_INTERNAL.has(internalKey)) return DB_SKU_BY_INTERNAL.get(internalKey);
      let prodObj = null;
      for (const cat of Object.keys(PRODUCTS)) {
        prodObj = (PRODUCTS[cat] || []).find(p => p.id === prodId);
        if (prodObj) break;
      }
      if (!prodObj) return `${prodId}__${colId}__${vr}`;
      const colObj = prodObj.colors.find(c => c.id === colId) || prodObj.colors[0];
      const prefix = prodObj.prefix || prodObj.id.toUpperCase();
      const code = colObj.code || colObj.name.toUpperCase().replace(/\s+/g, '');
      const vClean = vr.replace(/\s+|\/|\+/g, '').toUpperCase();
      return `AAPL-${prefix}-${code}-${vClean}`;
    }

      DB_INTERNAL_BY_SKU.clear();

      rows.forEach(row => {
        const category = String(row.category || 'iphone').toLowerCase();
        const modelName = String(row.model_name || 'Apple Device').trim();
        const sku = String(row.sku || '').trim();
        const skuParts = sku.split('-');
        const prefix = skuParts.length > 2 ? skuParts[1] : slugId(modelName).toUpperCase();
        const modelKey = `${category}::${modelName}`;

        if (!groups.has(modelKey)) {
          groups.set(modelKey, {
            id: prefix.toLowerCase(),
            name: modelName,
            prefix,
            msrpBase: Number(row.price_inr || 0),
            variants: [],
            prices: {},
            colors: []
          });
        }
        const product = groups.get(modelKey);
        const colorName = String(row.color || 'Standard').trim();
        const variant = String(row.variant || 'Standard').trim();
        const colorId = slugId(colorName) || 'standard';

        let color = product.colors.find(c => c.id === colorId);
        if (!color) {
          const fallback = Object.values(PRODUCTS).flat().find(p => p.name === modelName)?.colors
            ?.find(c => c.name.toLowerCase() === colorName.toLowerCase());
          color = {
            id: colorId,
            name: colorName,
            code: skuParts.length >= 4 ? skuParts.slice(2, -1).join('-') : colorName.toUpperCase().replace(/\s+/g, ''),
            hex: row.color_hex || fallback?.hex || '#64748B'
          };
          product.colors.push(color);
        }
        if (!product.variants.includes(variant)) product.variants.push(variant);
        product.prices[variant] = Number(row.price_inr || 0);
        product.msrpBase = Math.max(product.msrpBase, Number(row.price_inr || 0));

        const internalKey = `${product.id}__${colorId}__${variant}`;
        DB_SKU_BY_INTERNAL.set(internalKey, sku);
        DB_INTERNAL_BY_SKU.set(sku, { prodId: product.id, colId: colorId, vr: variant });
      });

      const rebuilt = {};
      groups.forEach((product, key) => {
        const category = key.split('::')[0];
        if (!rebuilt[category]) rebuilt[category] = [];
        product.variants.sort((a, b) => a.localeCompare(b, undefined, { numeric: true }));
        rebuilt[category].push(product);
      });
      Object.keys(rebuilt).forEach(cat => rebuilt[cat].sort((a, b) => a.name.localeCompare(b.name)));
      PRODUCTS = rebuilt;

      if (!PRODUCTS[currentCategory]?.length) currentCategory = Object.keys(PRODUCTS)[0] || 'iphone';
      const models = PRODUCTS[currentCategory] || [];
      if (!models.some(m => m.id === currentModelId)) currentModelId = models[0]?.id || '';
      const activeProd = models.find(m => m.id === currentModelId);
      if (activeProd && !activeProd.colors.some(c => c.id === selectedColorId)) {
        selectedColorId = activeProd.colors[0]?.id || '';
      }
    }

    // --- SUPABASE DATA LOAD & SAVE (ISOLATED TO myBranchId ONLY) ---
    async function loadBranchData() {
      const statusEl = document.getElementById('headerSyncStatus');
      if (!supabaseClient) {
        statusEl.textContent = 'Offline Mode';
        return;
      }
      statusEl.textContent = 'Syncing...';
      try {
        const [outletsRes, productsRes, invRes, transRes] = await Promise.all([
          supabaseClient.from('outlets').select('*').order('name'),
          supabaseClient.from('products').select('*'),
          // STRICTLY ONLY THIS BRANCH'S STOCK
          supabaseClient.from('inventory').select('*').eq('outlet_id', myBranchId),
          // STRICTLY TRANSFERS INVOLVING THIS BRANCH
          supabaseClient.from('transfers').select('*').or(`from_outlet.eq.${myBranchId},to_outlet.eq.${myBranchId}`)
        ]);

        if (outletsRes.data && outletsRes.data.length > 0) {
          OUTLETS = outletsRes.data;
          populateBranchSelector();
        }
        if (productsRes.data && productsRes.data.length > 0) {
          hydrateProductsFromDb(productsRes.data);
          populateModelDropdown();
        }

        branchStockMap = {};
        (invRes.data || []).forEach(row => {
          branchStockMap[row.sku] = Number(row.quantity_on_hand || 0);
          const t = row.updated_at || row.last_updated || row.created_at;
          if (t) branchLastUpdatedMap[row.sku] = t;
        });

        transferLogs = (transRes.data || []).sort((a, b) => String(b.created_at || '').localeCompare(String(a.created_at || '')));

        updateKPIs();
        renderStockCards();
        renderTransfersList();
        statusEl.textContent = `Live • ${OUTLETS.find(o => o.id === myBranchId)?.name || myBranchId}`;
      } catch (err) {
        console.error('Load error:', err);
        statusEl.textContent = 'Sync Error';
        showToast('Database sync failed: ' + err.message, true);
      }
    }

    async function saveSkuStock(canonicalSku, newQty, btnEl) {
      const qtyNum = Math.max(0, parseInt(newQty, 10) || 0);
      if (!supabaseClient) {
        showToast('Database unavailable', true);
        return;
      }
      if (btnEl) {
        btnEl.disabled = true;
        btnEl.textContent = 'Saving...';
      }
      const nowIso = new Date().toISOString();
      try {
        const payload = { sku: canonicalSku, outlet_id: myBranchId, quantity_on_hand: qtyNum };
        const { error } = await supabaseClient.from('inventory').upsert({ ...payload, updated_at: nowIso }, { onConflict: 'outlet_id,sku' });
        if (error) {
          const fallback = await supabaseClient.from('inventory').upsert(payload, { onConflict: 'outlet_id,sku' });
          if (fallback.error) throw fallback.error;
        }

        branchStockMap[canonicalSku] = qtyNum;
        branchLastUpdatedMap[canonicalSku] = nowIso;
        try {
          localStorage.setItem(`omnistock_branch_times_${myBranchId}`, JSON.stringify(branchLastUpdatedMap));
        } catch(e) {}

        updateKPIs();
        renderStockCards();
        showToast(`Updated ${canonicalSku} → ${qtyNum} units`);
      } catch (err) {
        showToast('Update failed: ' + err.message, true);
        if (btnEl) {
          btnEl.disabled = false;
          btnEl.textContent = 'Update';
        }
      }
    }

    // --- UI RENDERERS ---
    function populateBranchSelector() {
      const sel = document.getElementById('branchSelector');
      sel.innerHTML = OUTLETS.map(o => `<option value="${o.id}">${o.name}</option>`).join('');
      if (OUTLETS.some(o => o.id === myBranchId)) {
        sel.value = myBranchId;
      } else if (OUTLETS.length > 0) {
        myBranchId = OUTLETS[0].id;
        sel.value = myBranchId;
      }
    }

    function populateModelDropdown() {
      const sel = document.getElementById('modelDropdown');
      const models = PRODUCTS[currentCategory] || [];
      sel.innerHTML = models.map(m => `<option value="${m.id}">${m.name}</option>`).join('');
      if (models.some(m => m.id === currentModelId)) {
        sel.value = currentModelId;
      } else if (models.length > 0) {
        currentModelId = models[0].id;
        sel.value = currentModelId;
      }
    }

    function updateKPIs() {
      let totalBranchUnits = 0;
      Object.values(branchStockMap).forEach(q => {
        totalBranchUnits += Number(q || 0);
      });
      document.getElementById('kpiBranchUnits').textContent = totalBranchUnits.toLocaleString('en-IN');

      const incoming = transferLogs
        .filter(t => t.to_outlet === myBranchId && t.status === 'In-Transit')
        .reduce((sum, t) => sum + Number(t.quantity || 0), 0);
      document.getElementById('kpiIncomingUnits').textContent = incoming;

      const activeTransfers = transferLogs.filter(t => t.status !== 'Delivered').length;
      const badge = document.getElementById('navTransferBadge');
      badge.textContent = activeTransfers;
      badge.classList.toggle('hidden', activeTransfers === 0);
    }

    function renderStockCards() {
      const models = PRODUCTS[currentCategory] || [];
      const prod = models.find(p => p.id === currentModelId) || models[0];
      const colorRow = document.getElementById('colorPillsRow');
      const cardsBox = document.getElementById('variantCardsContainer');
      const colorLabel = document.getElementById('selectedColorLabel');

      if (!prod) {
        colorRow.innerHTML = '';
        cardsBox.innerHTML = '<div class="text-center text-xs text-slate-400 py-8">No models available.</div>';
        return;
      }

      if (!prod.colors.some(c => c.id === selectedColorId)) {
        selectedColorId = prod.colors[0]?.id || '';
      }
      const activeColor = prod.colors.find(c => c.id === selectedColorId) || prod.colors[0];
      colorLabel.textContent = activeColor ? activeColor.name : '—';

      // Render Color Pills
      colorRow.innerHTML = '';
      prod.colors.forEach(col => {
        const isSelected = col.id === activeColor.id;
        const btn = document.createElement('button');
        btn.className = `px-3 py-2 rounded-xl text-xs font-bold flex items-center gap-2 shrink-0 border transition ${
          isSelected
            ? 'bg-blue-600/20 border-blue-500 text-white shadow-sm'
            : 'bg-slate-900 border-slate-800 text-slate-300 hover:border-slate-700'
        }`;
        btn.innerHTML = `
          <span class="w-3.5 h-3.5 rounded-full border border-white/30 shrink-0" style="background-color: ${col.hex}"></span>
          <span>${col.name}</span>
        `;
        btn.onclick = () => {
          selectedColorId = col.id;
          renderStockCards();
        };
        colorRow.appendChild(btn);
      });

      // Render Variant Cards
      cardsBox.innerHTML = '';
      prod.variants.forEach((vr, idx) => {
        const canonicalSku = buildCanonicalSku(prod.id, activeColor.id, vr);
        const qty = branchStockMap[canonicalSku] ?? 0;
        const price = prod.prices[vr] || prod.msrpBase;
        const lastTime = formatTime(branchLastUpdatedMap[canonicalSku]);
        const inputId = `qty_inp_${idx}`;

        let badgeClass = 'bg-emerald-500/15 text-emerald-400 border-emerald-500/30';
        let badgeText = 'In Stock';
        if (qty === 0) {
          badgeClass = 'bg-rose-500/15 text-rose-400 border-rose-500/30';
          badgeText = 'Out of Stock';
        } else if (qty <= 2) {
          badgeClass = 'bg-amber-500/15 text-amber-400 border-amber-500/30';
          badgeText = 'Low Stock';
        }

        const card = document.createElement('div');
        card.className = 'bg-slate-900 border border-slate-800 rounded-2xl p-3.5 space-y-3 shadow-sm';
        card.innerHTML = `
          <div class="flex items-start justify-between gap-2">
            <div>
              <div class="text-sm font-extrabold text-white">${vr}</div>
              <div class="text-[11px] font-semibold text-emerald-400 mt-0.5">${formatINR(price)}</div>
              <div class="text-[9px] font-mono text-slate-500 mt-0.5">${canonicalSku}</div>
            </div>
            <span class="px-2 py-0.5 rounded-full text-[10px] font-bold border ${badgeClass}">${badgeText}</span>
          </div>

          <div class="bg-slate-950 border border-slate-800/90 rounded-xl p-2.5 flex items-center justify-between gap-2">
            <div class="flex items-center gap-1.5">
              <button type="button" onclick="stepInputVal('${inputId}', -1)" class="w-9 h-9 rounded-xl bg-slate-800 hover:bg-slate-700 text-white font-extrabold text-base flex items-center justify-center active:scale-95 transition border border-slate-700">-</button>
              <input type="number" id="${inputId}" min="0" max="999" value="${qty}"
                     class="w-14 h-9 text-center bg-slate-900 border border-slate-700 rounded-xl text-sm font-extrabold text-white focus:outline-none focus:border-blue-500">
              <button type="button" onclick="stepInputVal('${inputId}', 1)" class="w-9 h-9 rounded-xl bg-slate-800 hover:bg-slate-700 text-white font-extrabold text-base flex items-center justify-center active:scale-95 transition border border-slate-700">+</button>
            </div>

            <button type="button" onclick="saveSkuStock('${canonicalSku}', document.getElementById('${inputId}').value, this)"
                    class="px-4 h-9 rounded-xl bg-blue-600 hover:bg-blue-500 text-white text-xs font-bold shadow-md shadow-blue-600/20 active:scale-95 transition">
              Update
            </button>
          </div>

          <div class="flex items-center justify-between text-[10px] text-slate-400 pt-0.5 px-0.5">
            <span>Last Updated:</span>
            <span class="font-mono text-blue-300 font-semibold">${lastTime}</span>
          </div>
        `;
        cardsBox.appendChild(card);
      });
    }

    window.stepInputVal = function(inputId, delta) {
      const el = document.getElementById(inputId);
      if (!el) return;
      const val = Math.max(0, (parseInt(el.value, 10) || 0) + delta);
      el.value = val;
    };

    function renderTransfersList() {
      const container = document.getElementById('transfersCardsList');
      container.innerHTML = '';

      if (!transferLogs.length) {
        container.innerHTML = '<div class="bg-slate-900 border border-slate-800 rounded-2xl p-6 text-center text-xs text-slate-400">No transfers found for this branch.</div>';
        return;
      }

      transferLogs.forEach(t => {
        const isIncoming = t.to_outlet === myBranchId;
        const partnerId = isIncoming ? t.from_outlet : t.to_outlet;
        const partnerName = OUTLETS.find(o => o.id === partnerId)?.name || partnerId;

        const dirBadge = isIncoming
          ? '<span class="px-2 py-0.5 rounded bg-blue-500/20 text-blue-300 border border-blue-500/30 text-[10px] font-bold">↓ INCOMING</span>'
          : '<span class="px-2 py-0.5 rounded bg-purple-500/20 text-purple-300 border border-purple-500/30 text-[10px] font-bold">↑ OUTGOING</span>';

        const statusBadge = t.status === 'Delivered'
          ? '<span class="px-2 py-0.5 rounded bg-emerald-500/20 text-emerald-400 border border-emerald-500/30 text-[10px] font-bold">Delivered</span>'
          : '<span class="px-2 py-0.5 rounded bg-amber-500/20 text-amber-300 border border-amber-500/30 text-[10px] font-bold">' + t.status + '</span>';

        const card = document.createElement('div');
        card.className = 'bg-slate-900 border border-slate-800 rounded-2xl p-3.5 space-y-2.5 shadow-sm';
        card.innerHTML = `
          <div class="flex items-center justify-between">
            <span class="font-mono text-xs font-bold text-blue-400">${t.id}</span>
            <div class="flex items-center gap-1.5">${dirBadge} ${statusBadge}</div>
          </div>

          <div>
            <div class="text-xs font-bold text-white font-mono">${t.sku}</div>
            <div class="text-[11px] text-slate-400 mt-0.5">
              ${isIncoming ? 'From:' : 'To:'} <span class="text-slate-200 font-semibold">${partnerName}</span> &bull;
              Qty: <span class="text-white font-bold">${t.quantity} units</span>
            </div>
            ${t.courier_notes ? `<div class="text-[10px] text-slate-500 mt-0.5">Note: ${t.courier_notes}</div>` : ''}
          </div>

          ${isIncoming && t.status === 'In-Transit' ? `
            <button onclick="receiveTransfer('${t.id}', this)" class="w-full py-2.5 rounded-xl bg-emerald-600 hover:bg-emerald-500 text-white text-xs font-bold shadow-md transition active:scale-95">
              ✓ Receive & Add to My Stock
            </button>
          ` : ''}
        `;
        container.appendChild(card);
      });
    }

    window.receiveTransfer = async function(transferId, btnEl) {
      if (!supabaseClient) return;
      if (btnEl) {
        btnEl.disabled = true;
        btnEl.textContent = 'Receiving...';
      }
      try {
        const { error } = await supabaseClient.rpc('omnistock_receive_transfer', { p_transfer_id: transferId });
        if (error) throw error;
        showToast(`Transfer ${transferId} received & added to stock!`);
        await loadBranchData();
      } catch (err) {
        showToast('Receive failed: ' + err.message, true);
        if (btnEl) {
          btnEl.disabled = false;
          btnEl.textContent = '✓ Receive & Add to My Stock';
        }
      }
    };

    // --- EVENTS ---
    document.getElementById('branchSelector').addEventListener('change', (e) => {
      myBranchId = e.target.value;
      localStorage.setItem('omnistock_branch_id', myBranchId);
      try {
        const saved = localStorage.getItem(`omnistock_branch_times_${myBranchId}`);
        branchLastUpdatedMap = saved ? JSON.parse(saved) : {};
      } catch(err) { branchLastUpdatedMap = {}; }
      loadBranchData();
      showToast('Switched branch: ' + (OUTLETS.find(o => o.id === myBranchId)?.name || myBranchId));
    });

    document.querySelectorAll('.cat-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        document.querySelectorAll('.cat-btn').forEach(b => b.className = 'cat-btn py-2 rounded-lg text-slate-400 hover:text-white transition');
        btn.className = 'cat-btn py-2 rounded-lg bg-blue-600 text-white shadow-sm transition';
        currentCategory = btn.dataset.cat;
        currentModelId = PRODUCTS[currentCategory]?.[0]?.id || '';
        populateModelDropdown();
        renderStockCards();
      });
    });

    document.getElementById('modelDropdown').addEventListener('change', (e) => {
      currentModelId = e.target.value;
      renderStockCards();
    });

    document.querySelectorAll('.bottom-nav-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        document.querySelectorAll('.bottom-nav-btn').forEach(b => {
          b.className = 'bottom-nav-btn py-1.5 flex flex-col items-center justify-center text-slate-400 hover:text-slate-200 font-semibold text-[11px] transition relative';
        });
        btn.className = 'bottom-nav-btn py-1.5 flex flex-col items-center justify-center text-blue-400 font-bold text-[11px] transition relative';
        const target = btn.dataset.nav;
        document.getElementById('view-stock').classList.toggle('hidden', target !== 'stock');
        document.getElementById('view-transfers').classList.toggle('hidden', target !== 'transfers');
      });
    });

    // Transfer Modal Controls
    function openTransferModal() {
      const skuSel = document.getElementById('transferSkuSelect');
      skuSel.innerHTML = '';
      Object.keys(PRODUCTS).forEach(cat => {
        (PRODUCTS[cat] || []).forEach(prod => {
          prod.colors.forEach(col => {
            prod.variants.forEach(vr => {
              const sku = buildCanonicalSku(prod.id, col.id, vr);
              const opt = document.createElement('option');
              opt.value = sku;
              opt.textContent = `${prod.name} • ${col.name} (${vr})`;
              skuSel.appendChild(opt);
            });
          });
        });
      });

      const fromSel = document.getElementById('transferFromSelect');
      const toSel = document.getElementById('transferToSelect');
      fromSel.innerHTML = OUTLETS.map(o => `<option value="${o.id}">${o.name}</option>`).join('');
      toSel.innerHTML = OUTLETS.map(o => `<option value="${o.id}">${o.name}</option>`).join('');

      fromSel.value = myBranchId;
      const otherOutlet = OUTLETS.find(o => o.id !== myBranchId);
      if (otherOutlet) toSel.value = otherOutlet.id;

      document.getElementById('transferModal').classList.remove('hidden');
    }

    function closeTransferModal() {
      document.getElementById('transferModal').classList.add('hidden');
    }

    document.getElementById('openNewTransferBtn').addEventListener('click', openTransferModal);
    document.getElementById('closeTransferModalBtn').addEventListener('click', closeTransferModal);
    document.getElementById('cancelTransferBtn').addEventListener('click', closeTransferModal);

    document.getElementById('transferForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const skuVal = document.getElementById('transferSkuSelect').value;
      const fromId = document.getElementById('transferFromSelect').value;
      const toId = document.getElementById('transferToSelect').value;
      const qty = parseInt(document.getElementById('transferQtyInput').value, 10);
      const notes = document.getElementById('transferNotesInput').value.trim();

      if (fromId === toId) {
        showToast('From and To branch cannot be the same!', true);
        return;
      }
      if (!supabaseClient) return;

      const btn = document.getElementById('submitTransferBtn');
      btn.disabled = true;
      btn.textContent = 'Sending...';

      try {
        const docketId = `TR-BR-${Date.now()}`;
        const { error } = await supabaseClient.rpc('omnistock_create_transfer', {
          p_id: docketId,
          p_from_outlet: fromId,
          p_to_outlet: toId,
          p_sku: skuVal,
          p_quantity: qty,
          p_courier_notes: notes || 'Branch Transfer'
        });
        if (error) throw error;
        showToast(`Transfer ${docketId} created!`);
        closeTransferModal();
        document.getElementById('transferForm').reset();
        await loadBranchData();
      } catch (err) {
        showToast('Transfer error: ' + err.message, true);
      } finally {
        btn.disabled = false;
        btn.textContent = 'Send Docket';
      }
    });

    // Realtime Sync
    function startRealtime() {
      if (!supabaseClient) return;
      supabaseClient.channel('branch-mobile-realtime')
        .on('postgres_changes', { event: '*', schema: 'public', table: 'inventory', filter: `outlet_id=eq.${myBranchId}` }, () => loadBranchData())
        .on('postgres_changes', { event: '*', schema: 'public', table: 'transfers' }, () => loadBranchData())
        .on('postgres_changes', { event: '*', schema: 'public', table: 'outlets' }, () => loadBranchData())
        .subscribe();
    }

    // Boot
    populateBranchSelector();
    populateModelDropdown();
    renderStockCards();
    loadBranchData().then(startRealtime);
  </script>
</body>
</html>
